apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafanadashboard.yaml

configMapGenerator:
  - name: dashboard-cm
    files:
      - dashboard.json

replacements:
  - source:
      kind: ConfigMap
      name: dashboard-cm
    targets:
      - select:
          kind: GrafanaDashboard
          name: my-dashboard
        fieldPaths:
          - spec.configMapRef.name
