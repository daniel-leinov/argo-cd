apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: monitoring-prod

# Production-specific labels
commonLabels:
  environment: prod

# Patch to target production Grafana instance
patches:
  - target:
      kind: GrafanaDashboard
    patch: |-
      - op: replace
        path: /spec/instanceSelector
        value:
          matchLabels:
            dashboards: grafana-prod
      - op: add
        path: /metadata/annotations
        value:
          grafana.dashboard.environment: prod

# Production-specific configurations
# Disable editability in production dashboards for safety
  - target:
      kind: GrafanaDashboard
    patch: |-
      - op: add
        path: /metadata/annotations/grafana.dashboard.readonly
        value: "true"
