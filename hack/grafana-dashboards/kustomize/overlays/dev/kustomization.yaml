apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: monitoring-dev

# Development-specific labels
commonLabels:
  environment: dev

# Patch to target dev Grafana instance
patches:
  - target:
      kind: GrafanaDashboard
    patch: |-
      - op: replace
        path: /spec/instanceSelector
        value:
          matchLabels:
            dashboards: grafana-dev
      - op: add
        path: /metadata/annotations
        value:
          grafana.dashboard.environment: dev

# Override namespace for dev environment
# This allows testing dashboards before promoting to staging/prod
